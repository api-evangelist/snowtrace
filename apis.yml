- name: Routescan Etherscan-Compatible Account API
  description: >
    Retrieve address balances, normal and internal transaction histories, ERC-20 token transfers, ERC-721
    NFT transfers, ERC-1155 token transfers, and historical balance data by block number for any EVM address
    across all Routescan-indexed chains.
  image: https://snowtrace.io/favicon.ico
  humanURL: https://snowtrace.io/documentation/api/etherscan-like/accounts
  baseURL: https://api.routescan.io/v2/network/mainnet/evm/{chainId}/etherscan/api
  tags:
